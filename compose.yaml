name: roombook

x-api-image: &api-image
  image: roombook-api:local
  pull_policy: never

x-database-url: &database-url postgresql://roombook:${POSTGRES_PASSWORD:?Run scripts/init-env.sh}@postgres:5432/roombook

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: roombook
      POSTGRES_USER: roombook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.sh}
    volumes:
      - app-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U roombook -d roombook"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api-image
    command: ["npm", "run", "migration:run"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: *database-url
      APP_ORIGIN: http://localhost:3100
      OIDC_ALLOW_LOCAL_HTTP: "true"
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Run scripts/init-env.sh}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15

  reminders:
    <<: *api-image
    command: ["node", "dist/src/notifications/reminder-worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 4s
      retries: 15

volumes:
  app-data:
