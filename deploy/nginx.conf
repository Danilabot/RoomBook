server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Resolve through Docker DNS for each address lifetime, including after API recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location ~ ^/api/auth/(logout/)?callback/?$ {
        access_log off;
        # Upstream errors can include the original request with OAuth query parameters.
        error_log /dev/null crit;
        proxy_pass $api;
    }

    location /api/ {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
